[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traderai-framework"
version = "0.3.0"
description = "Forex research workspace with multi-agent analysis and backtesting"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
traderai = "traderai.cli:main"
traderai-validate = "traderai.validation:main"

[tool.setuptools.packages.find]
include = ["traderai*"]

[tool.setuptools.package-data]
traderai = ["web/*.html", "web/*.css", "web/*.js"]
